[build]
  command   = "npm run build"
  publish   = "dist"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security Headers ────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking — disallow iframe embedding
    X-Frame-Options = "DENY"

    # Block MIME-type sniffing
    X-Content-Type-Options = "nosniff"

    # Referrer privacy
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Permissions policy — disable unused browser features
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

    # Content Security Policy
    # - Allows scripts/styles from self + cdnjs (for any CDN fonts/icons if used)
    # - Allows images from self + Supabase storage + placehold.co
    # - Allows connections to Supabase API
    # - Blocks all frames, objects, base-tag hijacking
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob: https://*.supabase.co https://placehold.co https://ui-avatars.com;
      connect-src 'self' https://*.supabase.co https://*.supabase.in wss://*.supabase.co;
      frame-ancestors 'none';
      base-uri 'self';
      form-action 'self';
      object-src 'none';
    """

    # HSTS — enforce HTTPS for 1 year (only effective on HTTPS)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
